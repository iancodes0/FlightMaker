<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07090d"><link rel="icon" type="image/png" href="assets/turkishairwaysptfs-favicon.png"><title>Staff console | Turkish Airlines PTFS</title>
    <style>
      :root{color-scheme:dark;--ink:#f3f6fa;--muted:#9da8b7;--line:rgba(195,207,222,.15);--panel:rgba(11,16,24,.82);--red:#c8102e;--cyan:#66e4ed}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#07090d;font:15px/1.6 Inter,system-ui,sans-serif}.shell{width:min(940px,calc(100% - 32px));margin:auto}header{padding:22px 0;border-bottom:1px solid var(--line)}nav{display:flex;justify-content:space-between;align-items:center;gap:18px}a{color:inherit;text-decoration:none}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:38px;height:38px;border-radius:50%;background:#fff}.back{color:var(--cyan)}main{padding:80px 0}.eyebrow{color:var(--red);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}h1{margin:12px 0;font-size:clamp(2.7rem,7vw,5.5rem);line-height:.92;letter-spacing:-.08em}.intro,.notice{color:var(--muted)}form{max-width:620px;margin-top:30px;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#0d141e;font:inherit}.submit{margin-top:20px;border:0;border-radius:10px;padding:12px 17px;color:#fff;background:var(--red);font-weight:800;cursor:pointer}.error{color:#ff7182}@media(max-width:600px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body><header><div class="shell"><nav><a class="brand" href="./"><img src="assets/turkishairwaysptfs-logo.webp" alt="">TurkishAirwaysPTFS</a><a class="back" href="./">← Home</a></nav></div></header><main class="shell"><div class="eyebrow">Restricted operations</div><h1>Staff console.</h1><p class="intro">Create flights for the Turkish Airlines PTFS booking schedule.</p><form id="flight-form"><div class="grid"><label>Flight number<input name="flightNumber" placeholder="TK 001" required></label><label>Aircraft<input name="aircraft" placeholder="Airbus A350" required></label><label>Origin<input name="origin" placeholder="ORJ" required></label><label>Destination<input name="destination" placeholder="TFS" required></label><label>Departure<input name="departure" placeholder="Today · 20:30 UTC" required></label></div><button class="submit">Add flight</button><p id="message" class="notice"></p></form></main><script src="assets/site.js"></script><script>
    const form=document.querySelector("#flight-form"),message=document.querySelector("#message"); (async()=>{const session=await ptfs.setupAuth();if(!session){window.location.href=ptfs.DISCORD_SIGN_IN_URL;return}if(!session.user.isStaff){document.querySelector("main").innerHTML='<div class="eyebrow">Access denied</div><h1>Staff only.</h1><p class="intro">Your Discord account is not authorized to manage flights.</p>';return}form.addEventListener("submit",async(e)=>{e.preventDefault();try{await ptfs.api("/api/flights",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(form)))});message.textContent="Flight added to the booking schedule.";form.reset()}catch(error){message.className="notice error";message.textContent=error.message}})})();
  </script></body>
</html>
