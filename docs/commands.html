<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07090d">
    <link rel="icon" type="image/png" href="assets/turkishairwaysptfs-favicon.png">
    <title>Commands | Turkish Airlines PTFS</title>
    <style>
      :root { color-scheme: dark; --ink:#f3f6fa; --muted:#9da8b7; --line:rgba(195,207,222,.15); --panel:rgba(11,16,24,.82); --red:#c8102e; --cyan:#66e4ed; }
      * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#07090d; font:15px/1.6 Inter,system-ui,sans-serif; }
      .shell { width:min(940px,calc(100% - 32px)); margin:auto; } header { padding:22px 0; border-bottom:1px solid var(--line); }
      nav { display:flex; justify-content:space-between; align-items:center; gap:18px; } a { color:inherit; text-decoration:none; }
      .brand { display:flex; align-items:center; gap:10px; font-weight:800; } .brand img { width:38px; height:38px; border-radius:50%; background:#fff; }
      .back { color:var(--cyan); } main { padding:88px 0; } .eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.15em; font-size:.75rem; font-weight:800; }
      h1 { margin:12px 0 18px; font-size:clamp(2.8rem,7vw,5.5rem); line-height:.92; letter-spacing:-.08em; } .intro { max-width:560px; color:var(--muted); }
      .empty { margin-top:34px; padding:34px; border:1px solid var(--line); border-radius:18px; background:var(--panel); text-align:center; }
      .empty strong { display:block; margin-bottom:8px; font-size:1.25rem; } .empty p { margin:0; color:var(--muted); }
      .button { display:inline-flex; margin-top:22px; padding:11px 17px; border-radius:10px; color:#fff; background:var(--red); font-weight:800; }
    </style>
  </head>
  <body>
    <header><div class="shell"><nav><a class="brand" href="./"><img src="assets/turkishairwaysptfs-logo.webp" alt="">Turkish Airlines PTFS</a><a class="back" href="./">← Home</a></nav></div></header>
    <main class="shell">
      <div class="eyebrow">Bot command center</div>
      <h1>Commands.</h1>
      <p class="intro">This page will list the Turkish Airlines PTFS bot commands as they become available.</p>
      <section class="empty">
        <strong>No commands available yet.</strong>
        <p>We are preparing the bot experience. Check back soon for updates.</p>
        <a class="button" href="https://discord.gg/rJts4ADBmt">Join our Discord</a>
      </section>
    </main>
  </body>
</html>
